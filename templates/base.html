{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Parcel Fit{% endblock %}</title>
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml" />
    <link rel="stylesheet" href="{% static 'app.css' %}" />
  </head>
  <body class="app-shell">
    <header>
      <nav>
        <a class="brand" href="{% url 'dashboard' %}">
          <span>◈</span> Parcel Fit
        </a>
        <div class="navlinks">
          <a href="{% url 'dashboard' %}">Overview</a>
          <a href="{% url 'order_list' %}">Orders</a>
          <a href="{% url 'product_list' %}">Products</a>
          <a href="{% url 'box_list' %}">Boxes</a>
        </div>
        <a class="cart-link" href="{% url 'cart_detail' %}">
          Order cart <b>{{ cart_count }}</b>
        </a>
      </nav>
    </header>
    <main>
      {% if messages %} {% for message in messages %}
      <div class="message {{ message.tags }}" role="status">{{ message }}</div>
      {% endfor %} {% endif %} {% block content %}{% endblock %}
    </main>
  </body>
</html>
